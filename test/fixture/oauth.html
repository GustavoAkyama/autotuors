<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Autorizar acesso</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #fff;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border-radius: 8px;
        border: 0;
        background: #16a34a;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Tarefas Demo quer acessar sua conta</h2>
      <button type="button" id="allow">Autorizar</button>
    </main>
    <script>
      document.getElementById("allow").onclick = () => {
        window.opener?.postMessage("connected", "*");
        window.close();
      };
    </script>
  </body>
</html>
